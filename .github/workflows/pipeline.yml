name: Test and train baseball model

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Train and evaluate using historical games
        run: python -m baseball_prediction.cli

      - name: Upload evaluation and trained model
        uses: actions/upload-artifact@v4
        with:
          name: baseball-model-results
          path: artifacts/
          if-no-files-found: error
